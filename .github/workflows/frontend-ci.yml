name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'wasm/**'
      - 'dependencies/webmuxd/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'wasm/**'
      - 'dependencies/webmuxd/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build browser WASM distributions
        run: bun run build:wasm:dist

      - name: Typecheck frontend
        working-directory: frontend
        run: bun run typecheck

      - name: Test frontend
        working-directory: frontend
        run: bun run test

      - name: Build frontend
        working-directory: frontend
        run: bun run build
